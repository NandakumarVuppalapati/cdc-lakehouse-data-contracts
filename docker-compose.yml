# =============================================================================
# CDC Lakehouse with Data Contracts — Tier 0 (pipeline skeleton)
#
# Flow: Postgres (source OLTP) --Debezium--> Kafka --Iceberg Sink--> Iceberg
#       tables (MinIO storage, Nessie catalog) --queryable via--> Trino
#
# Tier 1 additions (not yet in this file, coming next): Apicurio Registry
# (schema contracts at ingestion), Dagster (orchestration), Prometheus +
# Grafana (observability). Tracked in docs/adr and PORTFOLIO_ASSETS.md.
# =============================================================================

networks:
  lakehouse-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  dagster_home:
  prometheus_data:
  grafana_data:
  marquez_db_data:

services:
  # ---------------------------------------------------------------------------
  # Source OLTP database. wal_level=logical is required for Debezium to read
  # the write-ahead log via the pgoutput logical decoding plugin.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: sourcedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d scripts run in filename-sort order, so the
      # 00- prefixed DB creation scripts happen before init.sql's shop schema.
      # All only apply on a fresh volume — see postgres/00-create-nessie-db.sql.
      - ./postgres/00-create-nessie-db.sql:/docker-entrypoint-initdb.d/00-create-nessie-db.sql
      - ./postgres/00-create-apicurio-db.sql:/docker-entrypoint-initdb.d/00-create-apicurio-db.sql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d sourcedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka in KRaft mode (no ZooKeeper). Single-node broker+controller combo,
  # sized for a laptop demo, not production throughput.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: lakehouse-kafka
    # Host-side port remapped to 9094 (container-internal port stays 9092) —
    # 9092 was already bound by another process/project on this machine.
    # Nothing inside the stack depends on the host port: Debezium and the
    # Iceberg sink both talk to Kafka over the Docker network at
    # kafka:29092, never via this host mapping. This port only matters if
    # you want to point a host-side tool (kcat, a local kafka-console-consumer)
    # at the broker from outside Docker.
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Required on a single-broker cluster. Kafka's transaction log defaults
      # to replication.factor=3 / min.isr=2, which a 1-node cluster can never
      # satisfy — any transactional producer (the Iceberg sink connector's
      # internal committer uses one) hangs on InitProducerId for 60s and then
      # dies. See ADR 0010.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - lakehouse-net
    healthcheck:
      # Must use the internal listener (29092), not 9092/PLAINTEXT_HOST.
      # PLAINTEXT_HOST advertises "localhost:9094" (the host-remapped port,
      # see the `ports:` comment above) — that address doesn't exist inside
      # the container's own network namespace, so a healthcheck against it
      # connects initially, then fails when the admin client reconnects
      # using the advertised address. 29092/PLAINTEXT advertises
      # "kafka:29092", which resolves correctly from inside the container.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka Connect running Debezium (source: Postgres -> Kafka) and the
  # Apache Iceberg Kafka Connect Sink (Kafka -> Iceberg tables). Built from
  # a custom Dockerfile on top of confluentinc/cp-kafka-connect, with both
  # connectors installed via confluent-hub. See ADR 0006 for why this base
  # image (not debezium/connect) and why confluent-hub (not a hand-built
  # Maven download) — two earlier approaches both failed.
  # ---------------------------------------------------------------------------
  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: lakehouse-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nessie:
        condition: service_healthy
      # The real fix for the "table doesn't exist" failures (see ADR 0014):
      # depending on nessie being healthy isn't enough, because trino-init
      # (which creates the bronze namespace) and kafka-connect (whose sink
      # tasks try to auto-create tables IN that namespace) both only waited
      # on nessie — nothing ordered them relative to each other. If the sink
      # tasks lost that race, they hit NessieReferenceConflictException and
      # went FAILED permanently (Kafka Connect does not retry a failed
      # task). Waiting on trino-init's own completion closes the race.
      trino-init:
        condition: service_completed_successfully
      # Not strictly required yet (no connector uses Avro/Apicurio until
      # ADR 0016's task #15), but added proactively now rather than after
      # switching the connector configs — same lesson as ADR 0011/0014,
      # applied before hitting it this time instead of after.
      apicurio:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_GROUP_ID: lakehouse-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: lakehouse-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: lakehouse-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: lakehouse-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components,/usr/share/java
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # S3-compatible object storage backing the Iceberg tables.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the "warehouse" bucket Iceberg writes tables into.
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse
      "
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Nessie: git-like catalog for Iceberg tables (branches, tags, merges).
  # JDBC version store backed by a dedicated `nessie` database on the same
  # Postgres instance — catalog metadata now survives container restarts,
  # not just the underlying MinIO data files. Kept as a separate database
  # (not the `sourcedb` OLTP schema) to keep source data and catalog
  # metadata cleanly independent. See ADR 0013 for why JDBC over RocksDB.
  # ---------------------------------------------------------------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: lakehouse-nessie
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: lakehouse
      QUARKUS_DATASOURCE_PASSWORD: lakehouse
    ports:
      - "19120:19120"
    networks:
      - lakehouse-net
    healthcheck:
      # Nessie has no readiness signal on its main port; the Quarkus
      # management interface on 9000 exposes smallrye-health instead. Added
      # after trino-init raced a fresh Nessie restart and lost (fired before
      # Nessie's JDBC store finished initializing) — see ADR 0013.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------------
  # Trino: the SQL engine dbt talks to. Iceberg catalog configured to use
  # Nessie for metadata and MinIO for storage.
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:483
    container_name: lakehouse-trino
    depends_on:
      nessie:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      # Host port remapped — 8080 is already taken on this machine (Airflow's
      # apiserver from another project). Container-internal port stays 8080;
      # nothing in this stack depends on the host mapping.
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # One-shot: creates the Iceberg namespaces (bronze, silver, gold). Required
  # because Nessie enforces that a namespace must exist before a table can be
  # created in it — unlike Hive/Glue, `iceberg.tables.auto-create-enabled=true`
  # on the sink connector (and dbt's own table creation) only creates tables,
  # never the parent namespace. Without this, writers crash on first write
  # with NessieReferenceConflictException: Namespace '<x>' must exist. See
  # ADR 0011. silver/gold added here proactively when dbt landed (Tier 1) —
  # same bug, caught before hitting it this time instead of after.
  # ---------------------------------------------------------------------------
  trino-init:
    image: trinodb/trino:483
    container_name: lakehouse-trino-init
    depends_on:
      trino:
        condition: service_healthy
    volumes:
      - ./trino-init/init-schemas.sh:/init-schemas.sh
    # List form (exact argv, no shell-string parsing through Compose's own
    # $/$$ interpolation) running a real mounted script. The script retries
    # each CREATE SCHEMA statement rather than trusting the healthcheck
    # alone to mean "ready" — see trino-init/init-schemas.sh and ADR 0017.
    entrypoint: ["/bin/sh", "/init-schemas.sh"]
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Apicurio Registry: Avro schema registry for the ingestion layer (contract
  # layer 1, see docs/architecture.md). Debezium and the Iceberg sink will
  # register/validate Avro schemas here instead of embedding raw JSON schemas
  # in every Kafka message. Postgres-backed from the start (APICURIO_STORAGE_KIND
  # =sql), not IN_MEMORY — applying the Nessie lesson (ADR 0013) proactively
  # rather than discovering the same "data vanished on restart" problem twice.
  # No healthcheck yet: Apicurio 3.x serves /health/ready on the Quarkus
  # management port (9000), same pattern as Nessie, but the exact path isn't
  # being guessed here — it'll be confirmed with a live curl once the
  # container is up, then added, matching how ADR 0013 was actually resolved.
  # ---------------------------------------------------------------------------
  apicurio:
    image: apicurio/apicurio-registry:3.3.1
    container_name: lakehouse-apicurio
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio_registry
      APICURIO_DATASOURCE_USERNAME: lakehouse
      APICURIO_DATASOURCE_PASSWORD: lakehouse
    ports:
      # 8081: main API/UI port (8080 taken by Airflow elsewhere on this
      # machine, 8082/8083 already used by trino/kafka-connect in this
      # stack). 9091: Quarkus management port (9000/9001 already taken by
      # MinIO's API+console in this stack).
      - "8081:8080"
      - "9091:9000"
    networks:
      - lakehouse-net
    healthcheck:
      # Confirmed live (not guessed) against the running container before
      # writing this — see ADR 0016. Apicurio 3.x follows the same pattern
      # as Nessie (ADR 0013): readiness lives on the Quarkus management
      # port, path is /health/ready (no /q/ prefix, unlike Nessie).
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------------
  # dbt Core (dbt-trino adapter). Not a long-running service — build image has
  # dbt installed, project + profiles mounted, and the default command just
  # prints the version so `docker compose up dbt` is a harmless smoke test.
  # Real usage: `docker compose run --rm dbt run` / `... dbt test` / etc.
  # Depends on trino-init (not just trino) so the silver/gold namespaces exist
  # before any model tries to create a table in them — see ADR 0011/0014.
  # ---------------------------------------------------------------------------
  dbt:
    build:
      context: ./dbt
    container_name: lakehouse-dbt
    depends_on:
      trino-init:
        condition: service_completed_successfully
      # Not required for `dbt --version` (the default command below), but
      # a real `dbt run`/`build` now emits OpenLineage events to marquez-api
      # as it goes (see ADR 0025) — depending on marquez-api being healthy
      # avoids every event silently failing against a backend that isn't up
      # yet, same ordering discipline as trino-init/apicurio elsewhere.
      marquez-api:
        condition: service_healthy
    environment:
      # Consumed by openlineage-dbt's `dbt-ol` wrapper (run_with_metrics.py
      # invokes `dbt-ol`, not the raw `dbt` binary — see ADR 0025).
      OPENLINEAGE_URL: http://marquez-api:5000
      OPENLINEAGE_NAMESPACE: cdc_lakehouse
    volumes:
      - ./dbt/cdc_lakehouse:/dbt/cdc_lakehouse
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml
    working_dir: /dbt/cdc_lakehouse
    networks:
      - lakehouse-net
    command: ["--version"]

  # ---------------------------------------------------------------------------
  # Great Expectations — contract layer 3 (row-level data quality). Runs
  # expectations against `iceberg.gold.gold_order_summary` via Trino, catching
  # bad *values* (invalid status strings, negative amounts) that dbt's Model
  # Contracts (layer 2, shape-only) and Apicurio's compatibility rules
  # (layer 1, also shape-only) can't. See ADR 0020 and great_expectations/README.md.
  # `depends_on: dbt` only waits for the dbt *container* to exit 0 (its
  # default command is `--version`, same as the dbt service block above) —
  # it does NOT guarantee gold_order_summary has actually been built. Same
  # manual-sequencing convention as the rest of this repo (compose ordering
  # controls container startup, not pipeline data-readiness): run
  # `docker compose run --rm dbt run` first, then this.
  #
  # Real usage: `docker compose run --rm great-expectations`
  #
  # `profiles: [jobs]` keeps this out of a plain `docker compose up -d` —
  # unlike dbt, it has no safe no-arg default (its ENTRYPOINT always runs
  # the real checkpoint), so without this it silently executed a checkpoint
  # against whatever Gold state happened to exist during a routine `up`.
  # Naming it explicitly (`docker compose run --rm great-expectations`)
  # still works with a profile attached — Compose activates a service's
  # profile automatically when it's targeted by name.
  # ---------------------------------------------------------------------------
  great-expectations:
    profiles: ["jobs"]
    build:
      context: ./great_expectations
    container_name: lakehouse-great-expectations
    depends_on:
      dbt:
        condition: service_completed_successfully
    volumes:
      - ./great_expectations/run_checkpoint.py:/gx/run_checkpoint.py
    working_dir: /gx
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Dagster — orchestration. Wraps the dbt project (Bronze sources -> Silver
  # -> Gold) and the Great Expectations checkpoint (as a blocking asset check
  # on gold_order_summary) into one lineage graph, viewable at
  # http://localhost:3000. See ADR 0022 and dagster/definitions.py.
  #
  # `dbt/cdc_lakehouse` and `dbt/profiles.yml` are mounted read/write here —
  # DbtProject.prepare_if_dev() needs to write target/manifest.json into the
  # project dir on load, same directory the dbt service itself already
  # writes to.
  # ---------------------------------------------------------------------------
  dagster:
    build:
      context: ./dagster
    container_name: lakehouse-dagster
    depends_on:
      trino-init:
        condition: service_completed_successfully
    volumes:
      - ./dagster/definitions.py:/app/definitions.py
      - ./dbt/cdc_lakehouse:/dbt/cdc_lakehouse
      - ./dbt/profiles.yml:/dbt/profiles/profiles.yml
      - dagster_home:/dagster_home
    ports:
      - "3000:3000"
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Prometheus: scrapes kafka-exporter (real consumer-group lag) and
  # Pushgateway (dbt build / GX checkpoint metrics, pushed by the short-lived
  # batch containers themselves — see dbt/run_with_metrics.py,
  # great_expectations/run_checkpoint.py, dagster/definitions.py). See
  # ADR 0024 and observability/prometheus/prometheus.yml for the scrape
  # config and the reasoning behind the pull-vs-push split.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: lakehouse-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lakehouse-net
    healthcheck:
      # prom/prometheus's unsuffixed tag is busybox-based (confirmed: same
      # image digest as the explicit -busybox tag), so wget is present even
      # though it's not a general-purpose image.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot-batch-job metrics acceptor. dbt/GX containers exit before
  # Prometheus could ever scrape them directly, so they push here instead,
  # and Prometheus scrapes Pushgateway itself — the pattern Prometheus's own
  # docs recommend for batch/ephemeral jobs, not a workaround.
  #
  # Host port 9096, not Pushgateway's default 9091 — that port was already
  # claimed by Apicurio's admin interface (see the apicurio service below),
  # a real collision caught by re-reading this file rather than assuming
  # each service's port block was independently correct. Nothing inside the
  # stack depends on the host mapping (Prometheus scrapes pushgateway:9091
  # over the internal network), so this is a same-shape fix to the "host
  # port remapped, container port untouched" pattern already used for kafka
  # and trino above.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    container_name: lakehouse-pushgateway
    ports:
      - "9096:9091"
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # kafka-exporter: real Kafka consumer-group lag, read directly from the
  # broker (Sarama admin client), not JMX. Filtered to the Iceberg sink
  # connectors' consumer groups — Kafka Connect's default sink consumer
  # group naming is `connect-<connector-name>` (confirmed, not assumed —
  # see ADR 0024), so `connect-shop-.*` catches all four
  # shop-iceberg-sink-* connectors and nothing else noisy.
  # ---------------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: lakehouse-kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
      - "--group.filter=connect-shop-.*"
      - "--topic.filter=shop\\..*"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Grafana: one dashboard (observability/grafana/dashboards/
  # lakehouse-overview.json), one datasource (Prometheus) — both
  # provisioned from mounted files, not clicked together by hand, so a
  # fresh `docker compose up -d grafana` already has the real dashboard on
  # first login. Anonymous Viewer access enabled (demo project, not
  # internet-exposed) purely so a portfolio screenshot doesn't have to show
  # a login screen; admin/admin still works for editing.
  # Host port 3001, not 3000 — 3000 is already Dagster's.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.4.8
    container_name: lakehouse-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/files
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Marquez: OpenLineage backend (API + Postgres store) and its web UI —
  # Tier 2 column-level lineage. Own dedicated Postgres (marquez-db), not the
  # shared lakehouse `postgres` service — mirrors Marquez's own reference
  # docker-compose.yml (confirmed against github.com/MarquezProject/marquez
  # before writing this, not guessed — see ADR 0025), and keeps its schema
  # independent the same way apicurio_registry/nessie already got their own
  # databases on the shared instance rather than reusing `sourcedb`.
  # Version 0.51.1 pinned — the newest tag Docker Hub lists as pushed (not
  # just "latest", which points at the same digest); marquez-web ships the
  # same version lockstep.
  # ---------------------------------------------------------------------------
  marquez-db:
    image: postgres:14
    container_name: lakehouse-marquez-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: marquez
    # Host port 5433, not 5432 — 5432 is already the shared lakehouse
    # `postgres` service's host mapping. Nothing inside the stack depends on
    # this host port; marquez-api reaches this container at marquez-db:5432
    # over the internal network.
    ports:
      - "5433:5432"
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  marquez-api:
    image: marquezproject/marquez:0.51.1
    container_name: lakehouse-marquez-api
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - lakehouse-net
    healthcheck:
      # Dropwizard admin interface exposes /healthcheck on the admin port —
      # confirmed against Marquez's own README before writing this (same
      # "verify the live endpoint, don't guess the framework's convention"
      # discipline as ADR 0013/0016).
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/healthcheck || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: lakehouse-marquez-web
    depends_on:
      marquez-api:
        condition: service_healthy
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
      REACT_APP_ADVANCED_SEARCH: "false"
    # Host port 3002 — 3000 is Dagster's, 3001 is Grafana's.
    ports:
      - "3002:3000"
    networks:
      - lakehouse-net
