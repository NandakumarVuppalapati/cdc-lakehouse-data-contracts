version: "3.8"

# =============================================================================
# CDC Lakehouse with Data Contracts — Tier 0 (pipeline skeleton)
#
# Flow: Postgres (source OLTP) --Debezium--> Kafka --Iceberg Sink--> Iceberg
#       tables (MinIO storage, Nessie catalog) --queryable via--> Trino
#
# Tier 1 additions (not yet in this file, coming next): Apicurio Registry
# (schema contracts at ingestion), Dagster (orchestration), Prometheus +
# Grafana (observability). Tracked in docs/adr and PORTFOLIO_ASSETS.md.
# =============================================================================

networks:
  lakehouse-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:
  # ---------------------------------------------------------------------------
  # Source OLTP database. wal_level=logical is required for Debezium to read
  # the write-ahead log via the pgoutput logical decoding plugin.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: sourcedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d sourcedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka in KRaft mode (no ZooKeeper). Single-node broker+controller combo,
  # sized for a laptop demo, not production throughput.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka Connect running Debezium (source: Postgres -> Kafka) and the
  # Apache Iceberg Kafka Connect Sink (Kafka -> Iceberg tables). Built from
  # a custom Dockerfile that layers the Iceberg sink connector on top of
  # the official Debezium Connect image.
  # ---------------------------------------------------------------------------
  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: lakehouse-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nessie:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: lakehouse-connect-cluster
      CONFIG_STORAGE_TOPIC: lakehouse-connect-configs
      OFFSET_STORAGE_TOPIC: lakehouse-connect-offsets
      STATUS_STORAGE_TOPIC: lakehouse-connect-status
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # S3-compatible object storage backing the Iceberg tables.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the "warehouse" bucket Iceberg writes tables into.
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse
      "
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Nessie: git-like catalog for Iceberg tables (branches, tags, merges).
  # In-memory version store for local dev — swap for a Postgres-backed store
  # before treating this as anything long-lived. See docs/adr/.
  # ---------------------------------------------------------------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: lakehouse-nessie
    environment:
      nessie.version.store.type: IN_MEMORY
    ports:
      - "19120:19120"
    networks:
      - lakehouse-net

  # ---------------------------------------------------------------------------
  # Trino: the SQL engine dbt talks to. Iceberg catalog configured to use
  # Nessie for metadata and MinIO for storage.
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:latest
    container_name: lakehouse-trino
    depends_on:
      - nessie
      - minio-init
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
