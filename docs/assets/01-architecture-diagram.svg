<svg viewBox="0 0 1700 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="18%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#0e1120"/>
      <stop offset="55%" stop-color="#06070c"/>
      <stop offset="100%" stop-color="#020203"/>
